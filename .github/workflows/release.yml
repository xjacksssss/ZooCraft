# Builds the mod when a version tag (v1.0.0, v1.2.3 ...) is pushed and publishes the jar as a GitHub release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches mod_version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match mod_version=${version} in gradle.properties" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: zoocraft-${{ env.VERSION }}
          path: build/libs/zoocraft-${{ env.VERSION }}.jar

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: ZooCraft ${{ env.VERSION }}
          files: build/libs/zoocraft-${{ env.VERSION }}.jar
          generate_release_notes: true
          body: |
            ZooCraft ${{ env.VERSION }} for Minecraft 1.21.1 and NeoForge 21.1.251 or later.
            Needs SmartBrainLib 1.16.11 or later. Install on the server and every client.
