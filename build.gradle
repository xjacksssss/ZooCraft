plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    // SmartBrainLib
    maven {
        url 'https://dl.cloudsmith.io/public/tslat/sbl/maven/'
        content { includeGroup 'net.tslat.smartbrainlib' }
    }
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // -Patm10 uses the original (non-recompiled) Minecraft jar so that other mods' mixins
    // targeting synthetic lambda names apply exactly as in production.
    enable {
        version = project.neo_version
        disableRecompilation = project.hasProperty('atm10')
    }

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // -PjoinServer joins a local runServer straight away; -PjoinServer=<host:port> joins another server.
            if (project.hasProperty('joinServer')) {
                programArguments.addAll '--quickPlayMultiplayer', project.property('joinServer').toString() ?: 'localhost:25565'
            }
        }

        client2 {
            client()
            gameDirectory = project.file('run-client2')
            programArguments.addAll '--username', 'Manager'
            if (project.hasProperty('joinServer')) {
                programArguments.addAll '--quickPlayMultiplayer', project.property('joinServer').toString() ?: 'localhost:25565'
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Boots the dev build alongside a copy of the ATM10 mods (see tools/sync-atm10-mods.ps1).
        atm10Client {
            client()
            gameDirectory = project.file('run-atm10')
            jvmArguments.addAll '-Xmx10G'
            // -PquickPlay=<world> opens that save from run-atm10/saves straight away.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
            // -PrecognitionAudit runs /zoo debug recognise audit as soon as the world loads, then closes the game
            // (tools/atm10/recognition-audit.sh).
            if (project.hasProperty('recognitionAudit')) {
                jvmArguments.addAll '-Dzoocraft.recognitionAudit=true'
            }
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Required mod dependency. Not bundled: ATM10 and CurseForge provide it.
    implementation "net.tslat.smartbrainlib:SmartBrainLib-neoforge-${minecraft_version}:${sbl_version}"

    // Geometry library, bundled with jar-in-jar.
    jarJar(implementation("org.locationtech.jts:jts-core")) {
        version {
            strictly "[${jts_version},2.0)"
            prefer jts_version
        }
    }
    // Non-mod libraries must also be put on the dev game's runtime classpath explicitly.
    additionalRuntimeClasspath "org.locationtech.jts:jts-core:${jts_version}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            sbl_version            : sbl_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
